name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Pack module
        run: |
          mkdir -p module/system/app/HabitGuard
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/HabitGuard/HabitGuard.apk
          rm -f module/system/app/HabitGuard/.gitkeep
      - uses: actions/upload-artifact@v4
        with:
          name: HabitGuard-module
          path: module/
          
